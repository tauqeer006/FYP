#                            KEY FEATURES
# ════════════════════════════════════════════════════════════════════════════
#
# 1. VOICE NAVIGATION
#    - User speaks route keywords
#    - AI matches keywords to routes
#    - Navigates to correct page URL
#
# 2. FORM FILLING
#    - Routes have form_schema definitions
#    - User speaks field values
#    - AI fills form fields automatically
#    - Example: "enter username john password 123"
#
# 3. BUTTON CLICKING
#    - Routes have button definitions
#    - User speaks button names
#    - AI clicks buttons programmatically
#    - Example: "click login button"
#
# 4. AUTHENTICATION HANDLING
#    - Routes marked with required_auth: true/false
#    - Voice system checks user login status
#    - Redirects to login if needed
#
# 5. ROLE-BASED ACCESS
#    - Each route specifies allowed user_roles
#    - Admin, Doctor, Patient, Anonymous roles
#    - Voice system enforces access control
