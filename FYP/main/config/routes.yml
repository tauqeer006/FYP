# ╔═════════════════════════════════════════════════════════════════════════╗
# ║          FYP Medical System - COMPLETE VOICE CHATBOT ROUTES              ║
# ║                         Configuration File (YAML)                        ║
# ╚═════════════════════════════════════════════════════════════════════════╝
#
# PURPOSE:
#   This YAML file contains ALL available routes in the FYP medical system.
#   It is used by the Voice Chatbot AI to understand user voice commands and
#   navigate to correct pages, fill forms, and click buttons.
#
# STRUCTURE:
#   route_id:
#     keywords: [list of voice commands that trigger this route]
#     description: "What this page does"
#     path: "/django-url/" - The actual Django URL path
#     required_auth: true/false - Login required?
#     user_roles: ["admin", "doctor", "patient"] - Who can access
#     category: "Category" - For organization
#     http_method: "GET|POST|POST" - HTTP method
#     form_schema: (optional) - Form definitions for voice form filling
#     buttons: (optional) - Button definitions for voice clicking
#
# VOICE COMMAND EXAMPLES:
#   - "go to patient dashboard" → patient_dashboard → /Patient_dashboard/
#   - "add new patient" → add_patient_record → /add_patient_record/
#   - "admin login" → admin_login → /admin_login1/
#   - "fill username john and password 123" → fill form fields
#   - "click submit button" → click submit button
#
# ─────────────────────────────────────────────────────────────────────────

routes:
  # ╔═════════════════════════════════════════════════════════════════════╗
  # ║         PUBLIC ROUTES - No Login Required (8 routes)               ║
  # ╚═════════════════════════════════════════════════════════════════════╝

  homepage:
    keywords: 
      - "home"
      - "main page"
      - "welcome"
      - "start"
      - "homepage"
      - "landing page"
      - "go home"
      - "go to home"
    description: "Main landing page of the FYP X-Ai Medical System"
    path: "/"
    required_auth: false
    user_roles: ["admin", "doctor", "patient", "anonymous"]
    category: "Public"
    http_method: "GET"
    icon: "home"

  admin_login:
    keywords: 
      - "admin login"
      - "admin signin"
      - "admin sign in"
      - "administrator login"
      - "login as admin"
      - "admin access"
      - "admin panel login"
      - "admin authentication"
    description: "Login page for administrators to access system management panel"
    path: "/admin_login1/"
    required_auth: false
    user_roles: ["admin", "anonymous"]
    category: "Authentication"
    http_method: "GET|POST"
    icon: "lock"
    form_schema:
      action: "/admin_login1/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "username"
          type: "text"
          label: "Username"
          placeholder: "Enter username"
          required: true
        - name: "password"
          type: "password"
          label: "Password"
          placeholder: "Enter password"
          required: true
      buttons:
        - text: "Login"
          type: "submit"
          class: "btn btn-primary"
        - text: "Cancel"
          action: "cancel"

  doctor_login:
    keywords:
      - "doctor login"
      - "doctor signin"
      - "doctor sign in"
      - "healthcare provider login"
      - "physician login"
      - "doctor access"
      - "doctor panel login"
      - "doctor authentication"
    description: "Login for doctors and healthcare professionals"
    path: "/login/"
    required_auth: false
    user_roles: ["doctor", "anonymous"]
    category: "Authentication"
    http_method: "GET|POST"
    icon: "stethoscope"
    form_schema:
      action: "/login/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "username"
          type: "text"
          label: "Username"
          placeholder: "Enter username or email"
          required: true
        - name: "password"
          type: "password"
          label: "Password"
          placeholder: "Enter password"
          required: true
      buttons:
        - text: "Login"
          type: "submit"
          class: "btn btn-primary"
        - text: "Reset Password"
          link: "/password_reset/"

  patient_login:
    keywords:
      - "patient login"
      - "patient signin"
      - "patient sign in"
      - "patient portal"
      - "patient access"
      - "patient panel login"
      - "patient authentication"
    description: "Login for patients to access health records and programs"
    path: "/patient_login/"
    required_auth: false
    user_roles: ["patient", "anonymous"]
    category: "Authentication"
    http_method: "GET|POST"
    icon: "user-circle"
    form_schema:
      action: "/patient_login/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "username"
          type: "text"
          label: "Username"
          placeholder: "Enter username"
          required: true
        - name: "password"
          type: "password"
          label: "Password"
          placeholder: "Enter password"
          required: true
      buttons:
        - text: "Login"
          type: "submit"
          class: "btn btn-primary"

  signup:
    keywords:
      - "sign up"
      - "signup"
      - "register"
      - "create account"
      - "new account"
      - "join the system"
      - "register new user"
      - "create new account"
    description: "Create a new user account in the FYP system"
    path: "/signup/"
    required_auth: false
    user_roles: ["anonymous"]
    category: "Authentication"
    http_method: "GET|POST"
    icon: "user-plus"
    form_schema:
      action: "/signup/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "username"
          type: "text"
          label: "Full Name"
          placeholder: "Enter your full name"
          required: true
        - name: "email"
          type: "email"
          label: "Email Address"
          placeholder: "Enter your email"
          required: true
        - name: "password"
          type: "password"
          label: "Password"
          placeholder: "Enter a strong password"
          required: true
        - name: "password_confirm"
          type: "password"
          label: "Confirm Password"
          placeholder: "Confirm your password"
          required: true
      buttons:
        - text: "Sign Up"
          type: "submit"
          class: "btn btn-primary"

  logout:
    keywords:
      - "logout"
      - "log out"
      - "sign out"
      - "goodbye"
      - "exit"
      - "disconnect"
    description: "Logout from current session and return to home page"
    path: "/logout/"
    required_auth: true
    user_roles: ["admin"]
    category: "Authentication"
    http_method: "GET"
    icon: "sign-out-alt"

  logout_doctor:
    keywords:
      - "logout doctor"
      - "doctor logout"
      - "log out doctor"
      - "sign out doctor"
    description: "Logout from doctor account and return to login"
    path: "/logout_doctor/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Authentication"
    http_method: "GET"
    icon: "sign-out-alt"

  patient_logout:
    keywords:
      - "logout patient"
      - "patient logout"
      - "log out patient"
      - "sign out patient"
    description: "Logout from patient account and return to login"
    path: "/patient_logouts"
    required_auth: true
    user_roles: ["patient"]
    category: "Authentication"
    http_method: "GET"
    icon: "sign-out-alt"

  # ╔═════════════════════════════════════════════════════════════════════╗
  # ║          ADMIN ROUTES - Dashboard & System Management (7 routes)   ║
  # ╚═════════════════════════════════════════════════════════════════════╝

  admin_dashboard:
    keywords:
      - "admin dashboard"
      - "admin home"
      - "administration panel"
      - "admin panel"
      - "management dashboard"
      - "admin index"
      - "system dashboard"
    description: "Admin dashboard for system management and analytics"
    path: "/index_admin/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET"
    icon: "chart-pie"
    buttons:
      - text: "Add User"
        link: "/add_user/"
      - text: "Manage Users"
        link: "/manage_user/"
      - text: "View All Records"
        link: "/records/"
      - text: "View Analytics"
        link: "/graphs"
      - text: "Logout"
        link: "/logout/"

  add_user:
    keywords:
      - "add user"
      - "add new user"
      - "create user"
      - "new user"
      - "add admin"
      - "add doctor"
      - "add patient"
      - "register user"
      - "create new user"
    description: "Add a new user to the system (admin, doctor, or patient)"
    path: "/add_user/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET|POST"
    icon: "user-plus"
    form_schema:
      action: "/add_user/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "username"
          type: "text"
          label: "Username"
          placeholder: "Enter username"
          required: true
        - name: "email"
          type: "email"
          label: "Email"
          placeholder: "Enter email address"
          required: true
        - name: "password"
          type: "password"
          label: "Password"
          placeholder: "Enter password"
          required: true
        - name: "user_type"
          type: "select"
          label: "User Type"
          options: ["admin", "doctor", "patient"]
          required: true
      buttons:
        - text: "Add User"
          type: "submit"
          class: "btn btn-primary"
        - text: "Cancel"
          action: "cancel"

  manage_users:
    keywords:
      - "manage users"
      - "manage user"
      - "user management"
      - "view users"
      - "all users"
      - "user list"
      - "user directory"
    description: "View and manage all users in the system"
    path: "/manage_user/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET"
    icon: "users"
    buttons:
      - text: "Add User"
        link: "/add_user/"
      - text: "Delete User"
        action: "delete_user"
      - text: "Edit User"
        action: "edit_user"
      - text: "Back to Dashboard"
        link: "/index_admin/"

  remove_doctor:
    keywords:
      - "remove doctor"
      - "delete doctor"
      - "remove healthcare provider"
      - "delete doctor from system"
      - "remove physician"
    description: "Remove a doctor from the system"
    path: "/delete-doctor/{doctor_id}/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET|POST"
    icon: "trash"
    parameters:
      doctor_id: "Numeric doctor ID"
    buttons:
      - text: "Confirm Delete"
        type: "submit"
        class: "btn btn-danger"
      - text: "Cancel"
        action: "cancel"

  view_all_records:
    keywords:
      - "view all records"
      - "all records"
      - "patient records"
      - "medical records"
      - "see records"
      - "system records"
      - "all data"
    description: "View all patient medical records in the system"
    path: "/records/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET"
    icon: "file-medical"
    buttons:
      - text: "Export Records"
        action: "export"
      - text: "Filter Records"
        action: "filter"
      - text: "Back to Dashboard"
        link: "/index_admin/"

  total_graphs:
    keywords:
      - "graphs"
      - "analytics"
      - "view graphs"
      - "statistics"
      - "system graphs"
      - "patient statistics"
      - "data analytics"
      - "system analytics"
    description: "View system analytics and statistics graphs"
    path: "/graphs"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET"
    icon: "chart-bar"
    buttons:
      - text: "Download Report"
        action: "download"
      - text: "Print"
        action: "print"
      - text: "Back to Dashboard"
        link: "/index_admin/"

  toggle_patient_dashboard:
    keywords:
      - "toggle patient"
      - "toggle patient visibility"
      - "show patient"
      - "hide patient"
      - "patient toggle"
    description: "Toggle patient visibility on admin dashboard"
    path: "/toggle_dashboard/{patient_idx}/"
    required_auth: true
    user_roles: ["admin"]
    category: "Admin"
    http_method: "GET"
    icon: "toggle-on"
    parameters:
      patient_idx: "Numeric patient index"

  # ╔═════════════════════════════════════════════════════════════════════╗
  # ║      DOCTOR ROUTES - Diagnosis, Patients, Reports (9 routes)       ║
  # ╚═════════════════════════════════════════════════════════════════════╝

  diagnosis:
    keywords:
      - "diagnosis"
      - "doctor dashboard"
      - "diagnose"
      - "fracture detection"
      - "x-ray analysis"
      - "medical diagnosis"
      - "x-ray upload"
      - "analyze x-ray"
    description: "Doctor's main page to upload and analyze X-ray images"
    path: "/diagnosis/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Doctor"
    http_method: "GET|POST"
    icon: "stethoscope"
    buttons:
      - text: "New Diagnosis"
        link: "/add_patient_record/"
      - text: "View Patients"
        link: "/patients/"
      - text: "Predict Diagnosis"
        link: "/predict/"
      - text: "Generate Report"
        link: "/Report/"
      - text: "Logout"
        link: "/logout_doctor/"

  add_patient_record:
    keywords:
      - "add patient"
      - "add new patient"
      - "create patient"
      - "new diagnosis"
      - "new patient record"
      - "create diagnosis"
      - "patient registration"
      - "register patient"
    description: "Add a new patient record and create diagnosis"
    path: "/add_patient_record/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Doctor"
    http_method: "GET|POST"
    icon: "user-plus"
    form_schema:
      action: "/add_patient_record/"
      method: "POST"
      enctype: "application/x-www-form-urlencoded"
      fields:
        - name: "fname"
          type: "text"
          label: "First Name"
          placeholder: "Enter patient first name"
          required: true
        - name: "lname"
          type: "text"
          label: "Last Name"
          placeholder: "Enter patient last name"
          required: true
        - name: "dob"
          type: "date"
          label: "Date of Birth"
          placeholder: "Select date of birth"
          required: true
        - name: "gender"
          type: "select"
          label: "Gender"
          options: ["M", "F", "O"]
          option_labels: ["Male", "Female", "Other"]
          required: true
        - name: "parents"
          type: "text"
          label: "Parent/Guardian Name"
          placeholder: "Enter parent or guardian name"
          required: true
        - name: "contact_number"
          type: "tel"
          label: "Contact Number"
          placeholder: "Enter phone number"
          required: true
        - name: "email"
          type: "email"
          label: "Email Address"
          placeholder: "Enter email address"
          required: false
        - name: "address"
          type: "text"
          label: "Address"
          placeholder: "Enter patient address"
          required: false
        - name: "medical_history"
          type: "textarea"
          label: "Medical History"
          placeholder: "Enter any relevant medical history, allergies, or conditions"
          required: false
      buttons:
        - text: "Add Patient"
          type: "submit"
          class: "btn btn-primary"
        - text: "Cancel"
          action: "cancel"

  view_patients:
    keywords:
      - "view patients"
      - "all patients"
      - "patient list"
      - "see patients"
      - "my patients"
      - "patients"
      - "patient directory"
    description: "View all patients assigned to this doctor"
    path: "/patients/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Doctor"
    http_method: "GET"
    icon: "users"
    buttons:
      - text: "Add New Patient"
        link: "/add_patient_record/"
      - text: "View Records"
        link: "/records/"
      - text: "Back to Dashboard"
        link: "/diagnosis/"

  predict_diagnosis:
    keywords:
      - "predict"
      - "predict diagnosis"
      - "prediction"
      - "patient prediction"
      - "diagnosis prediction"
      - "get prediction"
      - "ai prediction"
      - "fracture detection"
    description: "Get AI prediction for patient diagnosis using X-ray images"
    path: "/predict/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Doctor"
    http_method: "GET|POST"
    icon: "brain"
    form_schema:
      action: "/predict/"
      method: "POST"
      enctype: "multipart/form-data"
      fields:
        - name: "patient_id"
          type: "select"
          label: "Select Patient"
          placeholder: "Choose a patient from list"
          required: true
          dynamic: true
        - name: "xray_images"
          type: "file"
          label: "Upload X-Ray Images"
          placeholder: "Select X-ray image files"
          accept: "image/*"
          multiple: true
          required: true
      buttons:
        - text: "Get Prediction"
          type: "submit"
          class: "btn btn-primary"
        - text: "Clear"
          action: "reset"

  generate_report:
    keywords:
      - "report"
      - "generate report"
      - "create report"
      - "patient report"
      - "medical report"
      - "diagnosis report"
      - "save report"
    description: "Generate and view patient medical reports"
    path: "/Report/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Doctor"
    http_method: "GET|POST"
    icon: "file-pdf"
    buttons:
      - text: "Generate Report"
        type: "submit"
        class: "btn btn-primary"
      - text: "Download Report"
        action: "download"
      - text: "Print Report"
        action: "print"
      - text: "Back to Dashboard"
        link: "/diagnosis/"

  video_recommendations:
    keywords:
      - "video recommendations"
      - "exercise videos"
      - "recommended videos"
      - "treatment videos"
      - "therapy videos"
      - "video therapy"
      - "rehabilitation videos"
    description: "View video recommendations for patient treatment and exercises"
    path: "/video_Recommendation"
    required_auth: true
    user_roles: ["doctor", "patient"]
    category: "Exercise"
    http_method: "GET"
    icon: "video"
    buttons:
      - text: "Select Disease"
        action: "select_disease"
      - text: "Back to Dashboard"
        link: "/diagnosis/"

  display_videos:
    keywords:
      - "display videos"
      - "show videos"
      - "view videos"
      - "treatment videos"
      - "exercise videos for disease"
      - "disease videos"
    description: "Display treatment videos for specific disease"
    path: "/Recommend_video/{disease}/"
    required_auth: true
    user_roles: ["doctor", "patient"]
    category: "Exercise"
    http_method: "GET"
    icon: "video"
    parameters:
      disease: "Disease type (fracture, boneanomaly, etc.)"
    buttons:
      - text: "Play Video"
        action: "play"
      - text: "Download"
        action: "download"
      - text: "Back"
        link: "/video_Recommendation"

  monitor_exercise:
    keywords:
      - "monitor exercise"
      - "exercise monitoring"
      - "posture monitoring"
      - "exercise form"
      - "monitor posture"
      - "real-time monitoring"
      - "pose detection"
    description: "Monitor patient exercise form and posture using computer vision"
    path: "/Montoring_Exericse/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Exercise"
    http_method: "GET|POST"
    icon: "dumbbell"
    buttons:
      - text: "Start Monitoring"
        action: "start_monitoring"
      - text: "Stop Monitoring"
        action: "stop_monitoring"
      - text: "Save Results"
        type: "submit"
        class: "btn btn-primary"
      - text: "Back to Dashboard"
        link: "/diagnosis/"

  process_frame:
    keywords:
      - "process frame"
      - "frame processing"
      - "analyze frame"
      - "process video"
      - "video processing"
    description: "API endpoint for video frame processing in exercise monitoring"
    path: "/process_frame/"
    required_auth: true
    user_roles: ["doctor"]
    category: "Exercise"
    http_method: "POST"
    icon: "cog"

