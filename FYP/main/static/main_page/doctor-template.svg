<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c99960;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doctorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#doctorGrad)"/>
  
  <!-- Head -->
  <circle cx="150" cy="80" r="40" fill="url(#skinTone)"/>
  
  <!-- Hair -->
  <path d="M 110 80 Q 110 40 150 40 Q 190 40 190 80 Z" fill="#2c2c2c"/>
  
  <!-- Eyes -->
  <circle cx="135" cy="75" r="4" fill="#333"/>
  <circle cx="165" cy="75" r="4" fill="#333"/>
  <circle cx="136" cy="74" r="1.5" fill="white"/>
  <circle cx="166" cy="74" r="1.5" fill="white"/>
  
  <!-- Smile -->
  <path d="M 135 90 Q 150 98 165 90" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Doctor Coat (White) -->
  <rect x="110" y="125" width="80" height="180" rx="10" fill="white" stroke="#ddd" stroke-width="2"/>
  
  <!-- Stethoscope -->
  <path d="M 130 140 Q 140 150 150 150 Q 160 150 170 140" stroke="#667eea" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="125" cy="145" r="5" fill="#667eea"/>
  <circle cx="175" cy="145" r="5" fill="#667eea"/>
  
  <!-- Buttons on coat -->
  <circle cx="150" cy="160" r="3" fill="#ccc"/>
  <circle cx="150" cy="180" r="3" fill="#ccc"/>
  <circle cx="150" cy="200" r="3" fill="#ccc"/>
  
  <!-- Medical Badge -->
  <rect x="125" y="220" width="50" height="60" rx="5" fill="#667eea" stroke="#764ba2" stroke-width="2"/>
  <text x="150" y="235" font-size="10" fill="white" text-anchor="middle" font-family="Arial" font-weight="bold">MD</text>
  <text x="150" y="250" font-size="8" fill="white" text-anchor="middle" font-family="Arial">Doctor</text>
  <text x="150" y="265" font-size="7" fill="#e8eaf6" text-anchor="middle" font-family="Arial">Licensed</text>
  
  <!-- Hands -->
  <ellipse cx="110" cy="150" rx="8" ry="25" fill="url(#skinTone)"/>
  <ellipse cx="190" cy="150" rx="8" ry="25" fill="url(#skinTone)"/>
</svg>
