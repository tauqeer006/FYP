<!-- Chatbot Widget - Non-Intrusive Floating Component -->
<style>
  /* Chatbot Widget Styles - Isolated to prevent design conflicts */
  .chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9998;
    font-family: 'Poppins', sans-serif;
  }

  .chatbot-button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .chatbot-button:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
  }

  .chatbot-button.active {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  }

  /* Background listening indicator */
  .listening-indicator {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 14px;
    height: 14px;
    background: #4CAF50;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
    z-index: 9999;
  }

  .listening-indicator.active {
    background: #f44336;
    box-shadow: 0 0 12px rgba(244, 67, 54, 0.8);
  }

  .pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
    animation: pulse-animation 2s infinite;
  }

  @keyframes pulse-animation {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.2);
      opacity: 0.7;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  .chatbot-panel {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 380px;
    max-width: 90vw;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .chatbot-panel.active {
    display: flex;
  }

  .chatbot-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chatbot-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .chatbot-close {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chatbot-close:hover {
    transform: rotate(90deg);
    transition: transform 0.3s ease;
  }

  .chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chatbot-messages::-webkit-scrollbar {
    width: 6px;
  }

  .chatbot-messages::-webkit-scrollbar-track {
    background: #f1f1f1;
  }

  .chatbot-messages::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 3px;
  }

  .message {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    animation: slideIn 0.3s ease;
    max-width: 85%;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message.bot {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    align-self: flex-start;
    word-wrap: break-word;
  }

  .message.user {
    background: #e8eaf6;
    color: #333;
    align-self: flex-end;
    word-wrap: break-word;
  }

  .chatbot-input-area {
    padding: 15px;
    border-top: 1px solid #ddd;
    background: white;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .voice-button {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: #667eea;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s;
    padding: 0;
  }

  .voice-button:hover {
    background: #764ba2;
  }

  .voice-button.listening {
    background: #f5576c;
    animation: pulse 0.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .chatbot-text-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: border-color 0.3s;
  }

  .chatbot-text-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
  }

  .send-button {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: #667eea;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s;
    padding: 0;
  }

  .send-button:hover {
    background: #764ba2;
  }

  .send-button:active {
    transform: scale(0.95);
  }

  /* Mobile Responsive */
  @media (max-width: 480px) {
    .chatbot-widget {
      bottom: 10px;
      right: 10px;
    }

    .chatbot-button {
      width: 55px;
      height: 55px;
      font-size: 20px;
    }

    .chatbot-panel {
      width: calc(100vw - 20px);
      height: 60vh;
      bottom: 70px;
    }

    .message {
      max-width: 90%;
      font-size: 13px;
    }
  }
</style>

<div class="chatbot-widget">
  <!-- Floating Button -->
  <button class="chatbot-button" id="chatbot-toggle" title="Open Chatbot (or say 'Hey Bot')">
    <i class="fas fa-comments"></i>
  </button>
  
  <!-- Background Listening Indicator -->
  <div class="listening-indicator" id="listening-indicator" title="Listening for 'Hey Bot'...">
    <span class="pulse"></span>
  </div>

  <!-- Chat Panel -->
  <div class="chatbot-panel" id="chatbot-panel">
    <div class="chatbot-header">
      <h3>X-Ai Assistant</h3>
      <button class="chatbot-close" id="chatbot-close" title="Close">×</button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
      <div class="message bot">
        👋 Hello! I'm your X-Ai assistant. Try saying "diagnosis" or "patient reports" to navigate.
      </div>
    </div>

    <div class="chatbot-input-area">
      <button class="voice-button" id="voice-button" title="Click to speak">
        <i class="fas fa-microphone"></i>
      </button>
      <input 
        type="text" 
        class="chatbot-text-input" 
        id="chatbot-input" 
        placeholder="Type or say a command..."
        autocomplete="off"
      >
      <button class="send-button" id="send-button" title="Send">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script>
// Form filling utility function
function fillFormFields(formSchema, formFields, buttonToClick) {
  if (!formFields || Object.keys(formFields).length === 0) {
    console.warn('No form fields to fill');
    return;
  }

  try {
    let filledCount = 0;
    let notFoundCount = 0;
    
    // Iterate through form fields and fill them
    Object.keys(formFields).forEach(fieldName => {
      const fieldValue = formFields[fieldName];
      
      // Try to find input by name attribute
      let inputElement = document.querySelector(`input[name="${fieldName}"], select[name="${fieldName}"], textarea[name="${fieldName}"]`);
      
      // If not found by name, try by ID (from form_schema)
      if (!inputElement && formSchema && formSchema.fields) {
        const fieldSchema = formSchema.fields.find(f => f.name === fieldName);
        if (fieldSchema && fieldSchema.id) {
          inputElement = document.getElementById(fieldSchema.id);
        }
      }
      
      if (inputElement) {
        const inputType = inputElement.type || inputElement.tagName.toLowerCase();
        
        if (inputType === 'checkbox') {
          inputElement.checked = (fieldValue === true || fieldValue === 'true' || fieldValue === 'checked');
        } else if (inputType === 'radio') {
          const radioGroup = document.querySelectorAll(`input[name="${fieldName}"][value="${fieldValue}"]`);
          if (radioGroup.length > 0) {
            radioGroup.forEach(radio => radio.checked = false);
            radioGroup[0].checked = true;
          }
        } else if (inputType === 'select' || inputElement.tagName === 'SELECT') {
          // For select/dropdown
          inputElement.value = fieldValue;
          // Trigger change event in case there's dependent field logic
          inputElement.dispatchEvent(new Event('change', { bubbles: true }));
        } else {
          // Text, email, password, date, tel, textarea, file, etc.
          inputElement.value = fieldValue;
          inputElement.dispatchEvent(new Event('input', { bubbles: true }));
          inputElement.dispatchEvent(new Event('change', { bubbles: true }));
        }
        
        console.log(`✓ Filled field: ${fieldName} = ${fieldValue}`);
        filledCount++;
      } else {
        console.warn(`✗ Could not find field: ${fieldName}`);
        notFoundCount++;
      }
    });
    
    // Only click button if it's explicitly mentioned (not null)
    if (buttonToClick && buttonToClick.toLowerCase() !== 'null') {
      setTimeout(() => {
        let button = null;
        
        // Try to find button by text content (case-insensitive)
        const buttons = document.querySelectorAll('button, input[type="submit"]');
        button = Array.from(buttons).find(btn => 
          btn.textContent.trim().toLowerCase() === buttonToClick.toLowerCase() || 
          btn.value.toLowerCase() === buttonToClick.toLowerCase()
        );
        
        // If not found, try common submit button patterns
        if (!button) {
          button = document.querySelector('button[type="submit"]');
        }
        
        if (button) {
          console.log(`✓ Clicking button: ${buttonToClick}`);
          button.click();
        } else {
          console.warn(`✗ Could not find button: ${buttonToClick}`);
        }
      }, 200);
    }
    
  } catch (error) {
    console.error('Error filling form:', error);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('chatbot-toggle');
  const panel = document.getElementById('chatbot-panel');
  const closeBtn = document.getElementById('chatbot-close');
  const voiceBtn = document.getElementById('voice-button');
  const sendBtn = document.getElementById('send-button');
  const input = document.getElementById('chatbot-input');
  const messagesDiv = document.getElementById('chatbot-messages');

  let isListening = false;
  let isBackgroundListening = false;
  let recognition = null;
  let backgroundRecognition = null;
  let backgroundListeningEnabled = false;
  const WAKE_WORDS = ['hey bot', 'hello bot', 'ok bot', 'okay bot', 'bot'];
  const indicator = document.getElementById('listening-indicator');

  // Check for Web Speech API support
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    console.error('❌ Speech Recognition API not supported in this browser');
    if (indicator) indicator.style.display = 'none';
  }
  
  if (SpeechRecognition) {
    // Main recognition for chatbot panel
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.language = 'en-US';

    recognition.onstart = function() {
      isListening = true;
      voiceBtn.classList.add('listening');
      console.log('🎤 Voice recognition started');
    };

    recognition.onend = function() {
      isListening = false;
      voiceBtn.classList.remove('listening');
      console.log('⏹️ Voice recognition ended');
    };

    recognition.onresult = function(event) {
      let transcript = '';
      let isFinal = false;
      
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          isFinal = true;
        }
      }
      
      console.log('Speech recognized:', { transcript, isFinal, confidence: event.results[event.results.length - 1][0].confidence });
      
      if (transcript.trim()) {
        input.value = transcript.trim();
        if (isFinal) {
          console.log('✅ Final speech received, sending message...');
          setTimeout(() => {
            sendMessage();
          }, 100);
        }
      }
    };

    recognition.onerror = function(event) {
      console.error('Speech recognition error:', event.error);
      voiceBtn.classList.remove('listening');
    };

    // Background recognition - always listening for wake word
    backgroundRecognition = new SpeechRecognition();
    backgroundRecognition.continuous = true;
    backgroundRecognition.interimResults = true;
    backgroundRecognition.language = 'en-US';

    backgroundRecognition.onstart = function() {
      isBackgroundListening = true;
      if (indicator) indicator.classList.add('active');
      console.log('🎤 Background voice listening enabled. Say "Hey Bot" to activate.');
    };

    backgroundRecognition.onend = function() {
      isBackgroundListening = false;
      if (indicator) indicator.classList.remove('active');
      // Restart background listening if not stopped intentionally
      if (document.hidden === false) {
        setTimeout(() => {
          try {
            backgroundRecognition.start();
          } catch (e) {
            console.log('Background listening will restart...');
          }
        }, 100);
      }
    };

    backgroundRecognition.onresult = function(event) {
      let transcript = '';
      let isFinal = false;
      
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript.toLowerCase();
        if (event.results[i].isFinal) {
          isFinal = true;
        }
      }
      
      // Check for wake word
      if (isFinal) {
        const hasWakeWord = WAKE_WORDS.some(word => transcript.includes(word));
        if (hasWakeWord) {
          console.log('✨ Wake word detected! Opening chatbot and listening...');
          
          // Open chatbot panel
          panel.classList.add('active');
          toggle.classList.add('active');
          input.focus();
          
          // Show wake word message
          const wakeMsg = document.createElement('div');
          wakeMsg.className = 'message bot';
          wakeMsg.textContent = '🎤 I\'m listening! What would you like to do?';
          messagesDiv.appendChild(wakeMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          
          // Stop background listening and start main listening
          backgroundRecognition.stop();
          setTimeout(() => {
            recognition.start();
          }, 300);
        }
      }
    };

    backgroundRecognition.onerror = function(event) {
      if (event.error !== 'no-speech') {
        console.log('Background listening error, restarting...');
      }
    };

    // Start background listening with delay to ensure page is ready
    function startBackgroundListening() {
      if (!backgroundListeningEnabled) return;
      try {
        backgroundRecognition.start();
        console.log('✅ Background listening started');
      } catch (e) {
        console.log('⚠️ Background listening will start when ready');
        setTimeout(startBackgroundListening, 1000);
      }
    }

    // Enable background listening after a short delay
    setTimeout(() => {
      backgroundListeningEnabled = true;
      startBackgroundListening();
    }, 2000);

    // Handle page visibility - stop listening if page hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (isBackgroundListening) {
          try { backgroundRecognition.stop(); } catch(e) {}
        }
        if (isListening) {
          try { recognition.stop(); } catch(e) {}
        }
      } else {
        if (backgroundListeningEnabled) {
          setTimeout(startBackgroundListening, 500);
        }
      }
    });
  }

  // Toggle panel
  toggle.addEventListener('click', () => {
    panel.classList.toggle('active');
    toggle.classList.toggle('active');
    
    if (panel.classList.contains('active')) {
      input.focus();
      // Stop background listening, start main
      if (isBackgroundListening) {
        try { backgroundRecognition.stop(); } catch(e) {}
      }
    } else {
      // Resume background listening when panel closed
      if (!isListening && backgroundListeningEnabled && SpeechRecognition) {
        setTimeout(() => {
          try {
            backgroundRecognition.start();
          } catch (e) {
            console.log('Background listening will resume...');
          }
        }, 300);
      }
    }
  });

  // Close panel
  closeBtn.addEventListener('click', () => {
    panel.classList.remove('active');
    toggle.classList.remove('active');
    if (isListening) {
      try { recognition.stop(); } catch(e) {}
    }
    // Resume background listening
    if (!isBackgroundListening && backgroundListeningEnabled && SpeechRecognition) {
      setTimeout(() => {
        try {
          backgroundRecognition.start();
        } catch (e) {
          console.log('Background listening will resume...');
        }
      }, 300);
    }
  });

  // Voice button - manual trigger
  voiceBtn.addEventListener('click', () => {
    if (!recognition) {
      console.error('❌ Voice recognition not available');
      alert('Voice recognition not supported in your browser. Please use Chrome, Edge, or Firefox.');
      return;
    }
    if (isListening) {
      console.log('🛑 Stopping voice recognition');
      recognition.stop();
    } else {
      console.log('🎤 Starting voice recognition');
      try {
        recognition.start();
      } catch (e) {
        console.error('Error starting recognition:', e);
      }
    }
  });

  // Send message function
  const sendMessage = async () => {
    const text = input.value.trim();
    if (!text) return;

    // Add user message to UI
    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    messagesDiv.appendChild(userMsg);
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Send to backend
    try {
      const response = await fetch('/api/chatbot/query/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ query: text })
      });

      const data = await response.json();

      // Add bot response
      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      
      // Check response type
      if (data.response_type === 'conversation') {
        // Conversational response - just display the answer
        botMsg.textContent = data.answer || data.message || 'I didn\'t understand that.';
        messagesDiv.appendChild(botMsg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } else if (data.response_type === 'form_fill') {
        // Form fill response - fill form on CURRENT page, don't navigate
        if (data.success && data.form_fields) {
          botMsg.textContent = '📝 ' + (data.message || 'Filling form fields...');
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          
          // Fill form fields on current page (no navigation)
          setTimeout(() => {
            fillFormFields(data.form_schema, data.form_fields, data.button_to_click);
          }, 300);
        } else {
          botMsg.textContent = data.message || '❓ Could not fill form.';
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      } else if (data.response_type === 'button_click') {
        // Button click response - click button on CURRENT page, don't navigate
        if (data.success && data.button_to_click) {
          botMsg.textContent = '🔘 ' + (data.message || 'Clicking button...');
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          
          // Click button on current page
          setTimeout(() => {
            const buttons = document.querySelectorAll('button');
            let found = false;
            for (let btn of buttons) {
              if (btn.textContent.toLowerCase().includes(data.button_to_click.toLowerCase())) {
                btn.click();
                found = true;
                break;
              }
            }
            if (!found) {
              console.warn(`Button "${data.button_to_click}" not found on page`);
            }
          }, 300);
        } else {
          botMsg.textContent = data.message || '❓ Could not click button.';
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      } else if (data.response_type === 'navigation') {
        // Navigation response - show and redirect
        if (data.success && data.matched_route) {
          botMsg.textContent = '✅ Navigating to: ' + data.matched_route.description;
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          
          // Navigate after a short delay
          setTimeout(() => {
            window.location.href = data.matched_route.path;
          }, 800);
        } else {
          botMsg.textContent = data.message || '❓ Could not find that page.';
          messagesDiv.appendChild(botMsg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      } else {
        // Fallback for any other response
        botMsg.textContent = data.message || data.answer || 'Let me help you navigate the app!';
        messagesDiv.appendChild(botMsg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    } catch (error) {
      console.error('Error:', error);
      const errorMsg = document.createElement('div');
      errorMsg.className = 'message bot';
      errorMsg.textContent = '⚠️ Error connecting to chatbot';
      messagesDiv.appendChild(errorMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  };

  // Send button click
  sendBtn.addEventListener('click', sendMessage);

  // Enter key in input
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Close on Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panel.classList.contains('active')) {
      panel.classList.remove('active');
      toggle.classList.remove('active');
      if (isListening) {
        try { recognition.stop(); } catch(e) {}
      }
      // Resume background listening
      if (!isBackgroundListening && backgroundListeningEnabled && SpeechRecognition) {
        setTimeout(() => {
          try {
            backgroundRecognition.start();
          } catch (e) {
            console.log('Background listening will resume...');
          }
        }, 300);
      }
    }
  });

  // Get CSRF token
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
});
</script>
