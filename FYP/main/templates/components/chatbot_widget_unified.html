<!-- UNIFIED AI CHATBOT WIDGET - Single Button, Always Listening -->
<style>
  /* ===== UNIFIED CHATBOT WIDGET ===== */
  .unified-chatbot-widget {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    font-family: 'Poppins', sans-serif;
  }

  /* Main Floating Button */
  .chatbot-float-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: 3px solid white;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-size: 32px;
    position: relative;
  }

  .chatbot-float-btn:hover {
    transform: scale(1.15);
    box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
  }

  .chatbot-float-btn.listening::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid #667eea;
    animation: pulse-ring 2s infinite;
  }

  @keyframes pulse-ring {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    100% {
      transform: scale(1.3);
      opacity: 0;
    }
  }

  /* Chat Panel */
  .chatbot-panel-unified {
    position: absolute;
    bottom: 90px;
    right: 0;
    width: 420px;
    max-width: 95vw;
    height: 600px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease-out;
  }

  .chatbot-panel-unified.active {
    display: flex;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Header with Bot Status */
  .chatbot-header-unified {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: space-between;
  }

  .bot-status {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bot-avatar {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .bot-info h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  .bot-info p {
    margin: 2px 0 0 0;
    font-size: 12px;
    opacity: 0.9;
  }

  .listening-indicator {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .close-btn-unified {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }

  .close-btn-unified:hover {
    transform: rotate(90deg);
  }

  /* Messages Area */
  .chatbot-messages-unified {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f8f9fb;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chatbot-messages-unified::-webkit-scrollbar {
    width: 6px;
  }

  .chatbot-messages-unified::-webkit-scrollbar-track {
    background: #e5e7eb;
    border-radius: 10px;
  }

  .chatbot-messages-unified::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
  }

  .message {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message.bot {
    background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
    color: #1f2937;
    align-self: flex-start;
    max-width: 85%;
  }

  .message.user {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    align-self: flex-end;
    max-width: 85%;
  }

  .message.system {
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    align-self: center;
    text-align: center;
  }

  /* Input Area */
  .chatbot-input-area-unified {
    padding: 15px;
    border-top: 1px solid #e5e7eb;
    background: white;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chatbot-text-input-unified {
    flex: 1;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.2s;
  }

  .chatbot-text-input-unified:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .send-btn-unified {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }

  .send-btn-unified:hover {
    transform: scale(1.05);
  }

  .send-btn-unified:active {
    transform: scale(0.95);
  }

  /* Language Selector */
  .language-selector-unified {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #f5f5f5;
    border-bottom: 1px solid #e0e0e0;
    justify-content: center;
  }

  .lang-btn {
    padding: 6px 14px;
    border: 2px solid #ddd;
    background: white;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.3s;
    color: #333;
  }

  .lang-btn:hover {
    border-color: #667eea;
    color: #667eea;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: #667eea;
  }

  /* Voice Status Badge */
  .voice-status-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: #ef4444;
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  /* Voice Button */
  .voice-btn-unified {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.3s;
  }

  .voice-btn-unified:hover {
    transform: scale(1.1);
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
  }

  .voice-btn-unified:active {
    transform: scale(0.95);
  }

  .voice-btn-unified.listening {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    animation: voice-pulse 1s infinite;
  }

  @keyframes voice-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  }

  @media (max-width: 480px) {
    .chatbot-panel-unified {
      width: 100vw;
      height: 70vh;
      bottom: auto;
      right: auto;
      top: auto;
      left: 0;
      border-radius: 16px 16px 0 0;
    }

    .unified-chatbot-widget {
      bottom: 20px;
      right: 20px;
    }

    .message {
      max-width: 90% !important;
    }
  }
</style>

<!-- HTML Structure -->
<div class="unified-chatbot-widget">
  <!-- Floating Button -->
  <button class="chatbot-float-btn" id="chatbot-float-btn" title="Click to open AI Assistant">
    🤖
  </button>

  <!-- Chat Panel -->
  <div class="chatbot-panel-unified" id="chatbot-panel-unified">
    <!-- Header -->
    <div class="chatbot-header-unified">
      <div class="bot-status">
        <div class="bot-avatar">🤖</div>
        <div class="bot-info">
          <h4>X-Ai Assistant</h4>
          <p>Click the 🎤 button to speak</p>
        </div>
      </div>
      <button class="close-btn-unified" id="close-btn-unified">×</button>
    </div>

    <!-- Language Selector -->
    <div class="language-selector-unified">
      <button class="lang-btn active" id="lang-en-btn" data-lang="en">🇬🇧 English</button>
      <button class="lang-btn" id="lang-ur-btn" data-lang="ur">🇵🇰 اردو</button>
    </div>

    <!-- Messages -->
    <div class="chatbot-messages-unified" id="chatbot-messages-unified">
      <div class="message bot">
        👋 Hello! I'm your AI Assistant. Click the 🎤 button to start speaking, or type your message below!
      </div>
    </div>

    <!-- Input -->
    <div class="chatbot-input-area-unified">
      <button class="voice-btn-unified" id="voice-btn-unified" title="Click to start voice recording">
        🎤
      </button>
      <input
        type="text"
        class="chatbot-text-input-unified"
        id="chatbot-input-unified"
        placeholder="Type or use voice button..."
        autocomplete="off"
      >
      <button class="send-btn-unified" id="send-btn-unified">
        ➤
      </button>
    </div>
  </div>
</div>

<script>
// ===== UNIFIED CHATBOT WIDGET - ALWAYS LISTENING =====

let recognition = null;
let isListening = false;
let continuousMode = true; // Always ON
// NOTE: messageCount is declared globally in predict_vid.html, don't redeclare here

// Detect Language (Urdu vs English)

// ===== UNIFIED CHATBOT WIDGET - ALWAYS LISTENING =====

// NOTE: messageCount is declared globally in predict_vid.html, don't redeclare here
let selectedLanguage = 'en'; // Default language (English or Urdu)

// =======================================================
// === NEW VOICE-TO-TEXT IMPLEMENTATION (Start Here) ===
// =======================================================

function initVoiceRecognition() {
    if (window.webkitSpeechRecognition) {
        recognition = new webkitSpeechRecognition();
    } else if (window.SpeechRecognition) {
        recognition = new SpeechRecognition();
    } else {
        console.error('❌ Web Speech API is not supported in this browser.');
        return;
    }

    // Key settings for continuous listening
    recognition.continuous = true; 
    recognition.interimResults = true;
    recognition.lang = selectedLanguage; // 'en' or 'ur'

    // The core function: captures spoken audio and turns it into text
    recognition.onresult = function(event) {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript;
            } else {
                interimTranscript += transcript;
            }
        }
        
        // 1. Write the current spoken words (interim results) to the input box
        updateInterimChat(interimTranscript); 

        // 2. Process the final, confirmed phrase
        if (finalTranscript.trim().length > 0) {
            handleFinalVoiceCommand(finalTranscript.trim());
        }
    };

    // Auto-restart listening when one session ends (crucial for 'always listening')
    recognition.onend = function() {
        if (continuousMode) {
            recognition.start();
        } else {
            isListening = false;
        }
    };

    recognition.onerror = function(event) {
        console.error('🛑 Speech recognition error:', event.error);
        if (event.error === 'network' || event.error === 'audio-capture') {
             addMessage('⚠️ Voice error: Check your microphone and network connection.', 'system');
        }
    };

    // Start the recognition
    try {
        recognition.start();
        isListening = true;
        console.log(`🎤 Voice recognition started in ${selectedLanguage} mode.`);
    } catch (e) {
        // Prevent error if start is called when already active
        if (e.name !== 'InvalidStateError') {
            console.error('Error starting recognition:', e);
        }
    }
}

// Helper function to write the current spoken words into the input field
function updateInterimChat(text) {
    document.getElementById('chatbot-input-unified').value = text;
}

// Helper function to process the final command (sends it to the chat/API)
function handleFinalVoiceCommand(text) {
    // 1. Clear the interim text from the input box
    document.getElementById('chatbot-input-unified').value = '';

    // 2. Send the message to the chat history and the backend API
    sendChatMessage(text);
}


// You also need to call the initialization function when the page loads
document.addEventListener('DOMContentLoaded', () => {
    // Initial call to start the always-listening mode
    initVoiceRecognition(); 
    
    // Add event listeners for the language buttons to change the recognition language
    document.getElementById('lang-en-btn').addEventListener('click', () => setLanguage('en'));
    document.getElementById('lang-ur-btn').addEventListener('click', () => setLanguage('ur'));
});

// Function to change the recognition language
function setLanguage(lang) {
    selectedLanguage = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.lang === lang) {
            btn.classList.add('active');
        }
    });
    
    if (recognition) {
        recognition.stop(); // Stop the current session
        recognition.lang = lang; // Change the language
        recognition.start(); // Restart the session
        console.log(`🗣️ Language switched to: ${lang}`);
        addMessage(`Language switched to ${lang === 'en' ? 'English' : 'Urdu'}.`, 'system');
    }
}

// =======================================================
// === END NEW VOICE-TO-TEXT IMPLEMENTATION ===
// =======================================================


function detectLanguage(text) {
  const urduRegex = /[\u0600-\u06FF]/g;
  const urduChars = (text.match(urduRegex) || []).length;
  const totalChars = text.replace(/\s/g, '').length;
  return (totalChars === 0 || urduChars / totalChars <= 0.3) ? 'en' : 'ur';
}

// Translate Urdu to English
async function translateUrduToEnglish(urduText) {
  try {
    const response = await fetch('/api/translate/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({
        text: urduText,
        source_lang: 'ur',
        target_lang: 'en'
      })
    });

    if (response.ok) {
      const data = await response.json();
      return data.translated_text || urduText;
    }
    return urduText;
  } catch (error) {
    console.error('Translation error:', error);
    return urduText;
  }
}

// Get CSRF Token
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

// Text-to-Speech Function
function speakMessage(text) {
  try {
    // Cancel any previous speech
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0; // Normal speed
    utterance.pitch = 1.0; // Normal pitch
    utterance.volume = 1.0; // Max volume
    
    // Use English voice
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(voice => voice.lang.includes('en'));
    if (englishVoice) {
      utterance.voice = englishVoice;
    }
    
    console.log('🔊 Speaking:', text);
    window.speechSynthesis.speak(utterance);
  } catch (error) {
    console.warn('⚠️ Text-to-speech error:', error);
  }
}

// Fill Form Fields Function
function fillFormFields(formFields) {
  console.log('📝 Attempting to fill form fields:', formFields);
  
  if (!formFields || typeof formFields !== 'object') {
    console.warn('⚠️ No valid form fields provided');
    return false;
  }

  let filledCount = 0;
  
  // Try to fill each field
  for (const [fieldName, fieldValue] of Object.entries(formFields)) {
    console.log(`🔍 Looking for field: ${fieldName} = ${fieldValue}`);
    
    // Try multiple ways to find the field
    let filled = false;
    
    // Method 1: By name attribute
    let input = document.querySelector(`input[name="${fieldName}"]`);
    if (input) {
      input.value = fieldValue;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      console.log(`✅ Filled by name: ${fieldName}`);
      filledCount++;
      filled = true;
    }
    
    // Method 2: By id attribute
    if (!filled) {
      input = document.querySelector(`input#${fieldName}`);
      if (input) {
        input.value = fieldValue;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        console.log(`✅ Filled by id: ${fieldName}`);
        filledCount++;
        filled = true;
      }
    }
    
    // Method 3: By placeholder text
    if (!filled) {
      const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], input[type="username"]');
      for (let inp of inputs) {
        if (inp.placeholder && inp.placeholder.toLowerCase().includes(fieldName.toLowerCase())) {
          inp.value = fieldValue;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
          console.log(`✅ Filled by placeholder: ${fieldName}`);
          filledCount++;
          filled = true;
          break;
        }
      }
    }
    
    // Method 4: By label text
    if (!filled) {
      const labels = document.querySelectorAll('label');
      for (let label of labels) {
        if (label.textContent.toLowerCase().includes(fieldName.toLowerCase())) {
          const labelFor = label.getAttribute('for');
          if (labelFor) {
            input = document.querySelector(`#${labelFor}`);
            if (input) {
              input.value = fieldValue;
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
              console.log(`✅ Filled by label: ${fieldName}`);
              filledCount++;
              filled = true;
            }
          }
        }
      }
    }
    
    // Method 5: Search by common field names (username, email, password, etc.)
    if (!filled) {
      const commonNames = {
        'username': ['username', 'user', 'login', 'email', 'id'],
        'password': ['password', 'pwd', 'pass'],
        'email': ['email', 'mail'],
        'first_name': ['firstname', 'first', 'fname'],
        'last_name': ['lastname', 'last', 'lname']
      };
      
      const searchNames = commonNames[fieldName.toLowerCase()] || [fieldName.toLowerCase()];
      
      const inputs = document.querySelectorAll('input');
      for (let inp of inputs) {
        const name = inp.name?.toLowerCase() || '';
        const id = inp.id?.toLowerCase() || '';
        const placeholder = inp.placeholder?.toLowerCase() || '';
        
        if (searchNames.some(search => name.includes(search) || id.includes(search) || placeholder.includes(search))) {
          inp.value = fieldValue;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
          console.log(`✅ Filled by common field name: ${fieldName} → ${name || id || placeholder}`);
          filledCount++;
          filled = true;
          break;
        }
      }
    }
    
    if (!filled) {
      console.warn(`⚠️ Could not find field for: ${fieldName}`);
    }
  }
  
  console.log(`📊 Filled ${filledCount}/${Object.keys(formFields).length} fields`);
  return filledCount > 0;
}

// Add Message to Chat
function addMessage(text, type = 'bot') {
  const messagesDiv = document.getElementById('chatbot-messages-unified');
  const msg = document.createElement('div');
  msg.className = `message ${type}`;
  msg.textContent = text;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Render Menu Options as Clickable Buttons
function renderMenu(menuData) {
  const messagesDiv = document.getElementById('chatbot-messages-unified');
  
  // Create menu container
  const menuContainer = document.createElement('div');
  menuContainer.className = 'menu-container';
  menuContainer.style.cssText = `
    margin: 15px 0;
    padding: 15px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    border-radius: 12px;
    border: 2px solid #667eea;
  `;
  
  // Add menu title
  if (menuData.menu_title) {
    const title = document.createElement('h4');
    title.style.cssText = 'margin: 0 0 10px 0; color: #667eea; font-size: 16px; font-weight: 600;';
    title.textContent = menuData.menu_title;
    menuContainer.appendChild(title);
  }
  
  // Add menu subtitle
  if (menuData.menu_subtitle) {
    const subtitle = document.createElement('p');
    subtitle.style.cssText = 'margin: 0 0 15px 0; color: #666; font-size: 13px;';
    subtitle.textContent = menuData.menu_subtitle;
    menuContainer.appendChild(subtitle);
  }
  
  // Handle different menu types
  if (menuData.menu_type === 'main') {
    renderMainMenu(menuContainer, menuData);
  } else if (menuData.menu_type === 'urls') {
    renderUrlsMenu(menuContainer, menuData);
  } else if (menuData.menu_type === 'features') {
    renderFeaturesMenu(menuContainer, menuData);
  } else if (menuData.menu_type === 'help') {
    renderHelpMenu(menuContainer, menuData);
  } else if (menuData.menu_type === 'feature_details') {
    renderFeatureDetails(menuContainer, menuData);
  }
  
  messagesDiv.appendChild(menuContainer);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Render Main Menu
function renderMainMenu(container, menuData) {
  const optionsDiv = document.createElement('div');
  optionsDiv.style.cssText = 'display: flex; flex-direction: column; gap: 10px;';
  
  menuData.options.forEach(option => {
    const btn = document.createElement('button');
    btn.className = 'menu-button';
    btn.style.cssText = `
      padding: 12px 15px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      text-align: left;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    `;
    
    btn.onmouseover = () => {
      btn.style.borderColor = '#667eea';
      btn.style.backgroundColor = '#f0f4ff';
      btn.style.transform = 'translateX(5px)';
    };
    
    btn.onmouseout = () => {
      btn.style.borderColor = '#ddd';
      btn.style.backgroundColor = 'white';
      btn.style.transform = 'translateX(0)';
    };
    
    btn.onclick = () => sendChatMessage(`menu:${option.action}`);

// Send Message to Backend
async function sendChatMessage(text) {
  if (!text.trim()) {
    console.warn('⚠️ Empty message, ignoring');
    return;
  }

  console.log('📨 Sending message:', text);
  addMessage(text, 'user');
  document.getElementById('chatbot-input-unified').value = '';

  try {
    console.log('📡 Calling API: /api/chatbot/query/');
    const response = await fetch('/api/chatbot/query/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ query: text })
    });

    console.log('📥 API Response status:', response.status);
    
    if (!response.ok) {
      console.error('❌ API returned error status:', response.status);
      addMessage(`⚠️ API Error ${response.status}. Please try again.`, 'bot');
      return;
    }

    const data = await response.json();
    console.log('✅ API Response data:', data);

    // Handle menu responses
    if (data.response_type === 'menu') {
      console.log('📋 Menu detected:', data.menu_type);
      renderMenu(data);
      return;
    }

    // Handle multi-command
    if (data.response_type === 'multi_command') {
      console.log('🔗 Multi-command detected:', data.total_commands, 'commands');
      addMessage(`⚙️ Processing ${data.total_commands} commands...`, 'system');
      
      let delay = 800;
      let navCmd = null;

      data.commands.forEach((cmd, idx) => {
        setTimeout(() => {
          let emoji = '✅';
          let speechText = '';
          
          if (cmd.response_type === 'back') emoji = '↩️';
          else if (cmd.response_type === 'scroll') emoji = '⬇️';
          else if (cmd.response_type === 'button_click') emoji = '🔘';
          else if (cmd.response_type === 'form_fill') emoji = '📝';
          else if (cmd.response_type === 'navigation') emoji = '🗺️';
          else if (cmd.response_type === 'open_tab') emoji = '🆕';
          else if (cmd.response_type === 'close_tab') emoji = '🔴';
          else if (cmd.response_type === 'close_browser') emoji = '💻';
          else if (cmd.response_type === 'conversation') emoji = '💬';

          console.log(`💫 Executing command ${idx + 1}/${data.total_commands}: ${cmd.response_type}`);
          addMessage(`${emoji} ${cmd.message}`, 'system');

          // Execute command
          if (cmd.response_type === 'back') {
            console.log('↩️ Going back to previous page');
            speechText = 'Going back to previous page';
            speakMessage(speechText);
            setTimeout(() => {
              console.log('↩️ Using stored previous page for back');
              const previousPage = localStorage.getItem('previousPage');
              if (previousPage && previousPage !== window.location.href) {
                window.location.href = previousPage;
              } else {
                window.history.back();
              }
            }, 500);
          } else if (cmd.response_type === 'scroll' && cmd.scroll_direction) {
            console.log('⬇️ Scrolling:', cmd.scroll_direction);
            speechText = `Scrolling ${cmd.scroll_direction}`;
            speakMessage(speechText);
            window.scrollBy(0, cmd.scroll_direction === 'down' ? 300 : -300);
          } else if (cmd.response_type === 'close_browser') {
            console.log('💻 Closing entire browser');
            speechText = 'Closing browser';
            speakMessage(speechText);
            setTimeout(() => {
              window.open('', '_self').close();
            }, 500);
          } else if (cmd.response_type === 'close_tab') {
            console.log('🔴 Closing tab');
            speechText = 'Closing current tab';
            speakMessage(speechText);
            setTimeout(() => {
              window.close();
            }, 500);
          } else if (cmd.response_type === 'open_tab' && cmd.path) {
            console.log('🆕 Opening in new tab:', cmd.path);
            const pageName = cmd.path.split('/').filter(p => p).join(' ') || 'home';
            speechText = `Opening ${pageName} in new tab`;
            speakMessage(speechText);
            window.open(cmd.path, '_blank');
          } else if (cmd.response_type === 'button_click' && cmd.button_to_click) {
            console.log('🔘 Finding button:', cmd.button_to_click);
            speechText = `Clicking ${cmd.button_to_click} button`;
            speakMessage(speechText);
            
            let found = false;
            const searchText = cmd.button_to_click.toLowerCase();
            
            // Method 1: Look for <button> elements
            const buttons = document.querySelectorAll('button, input[type="submit"]');
            for (let btn of buttons) {
              if (btn.textContent.toLowerCase().includes(searchText)) {
                console.log('✅ Clicking button:', cmd.button_to_click);
                btn.click();
                found = true;
                break;
              }
            }
            
            // Method 2: Look for <a> links (navigation)
            if (!found) {
              const links = document.querySelectorAll('a');
              for (let link of links) {
                const linkText = link.textContent.toLowerCase();
                const linkTitle = (link.getAttribute('title') || '').toLowerCase();
                const linkId = (link.id || '').toLowerCase();
                
                if (linkText.includes(searchText) || linkTitle.includes(searchText) || linkId.includes(searchText)) {
                  console.log('✅ Clicking link:', cmd.button_to_click);
                  link.click();
                  found = true;
                  break;
                }
              }
            }
            
            // Method 3: Look for elements with onclick handlers
            if (!found) {
              const clickableElements = document.querySelectorAll('[onclick]');
              for (let elem of clickableElements) {
                if (elem.textContent.toLowerCase().includes(searchText)) {
                  console.log('✅ Clicking clickable element:', cmd.button_to_click);
                  elem.click();
                  found = true;
                  break;
                }
              }
            }
            
            // Method 4: Look for nav items or sidebar items
            if (!found) {
              const navItems = document.querySelectorAll('.nav-menu a, .sidebar a, .navbar a, li a, [role="menuitem"]');
              for (let item of navItems) {
                if (item.textContent.toLowerCase().includes(searchText)) {
                  console.log('✅ Clicking navigation item:', cmd.button_to_click);
                  item.click();
                  found = true;
                  break;
                }
              }
            }
            
            if (!found) {
              console.log('❌ Could not find clickable element for:', cmd.button_to_click);
            }
          } else if (cmd.response_type === 'form_fill' && cmd.form_fields) {
            console.log('📝 Filling form with:', cmd.form_fields);
            speechText = `Filling form with your information`;
            speakMessage(speechText);
            // Actually fill the form fields
            fillFormFields(cmd.form_fields);
            // If there's a submit button, show option or auto-click
            if (cmd.button_to_click) {
              setTimeout(() => {
                const buttons = document.querySelectorAll('button, input[type="submit"]');
                for (let btn of buttons) {
                  if (btn.textContent.toLowerCase().includes(cmd.button_to_click.toLowerCase())) {
                    console.log('✅ Auto-clicking submit button:', cmd.button_to_click);
                    btn.click();
                    break;
                  }
                }
              }, 500);
            }
          } else if (cmd.response_type === 'navigation' && cmd.path) {
            console.log('🗺️ Navigation scheduled to:', cmd.path);
            const pageName = cmd.path.split('/').filter(p => p).join(' ') || 'home';
            speechText = `Navigating to ${pageName}`;
            speakMessage(speechText);
            navCmd = cmd;
          } else if (cmd.response_type === 'conversation') {
            console.log('💬 Bot response:', cmd.answer);
            speakMessage(cmd.answer || cmd.message);
          }
        }, delay);
        delay += 600;
      });

      setTimeout(() => {
        if (navCmd) {
          console.log('🚀 Navigating to:', navCmd.path);
          window.location.href = navCmd.path;
        }
      }, delay);
    }
    // Handle single command
    if (data.response_type === 'back') {
      console.log('↩️ Back command');
      addMessage(`↩️ ${data.message || 'Going back...'}`, 'system');
      speakMessage('Going back to previous page');
      setTimeout(() => {
        console.log('↩️ Executing back - using stored previous page');
        const previousPage = localStorage.getItem('previousPage');
        if (previousPage && previousPage !== window.location.href) {
          window.location.href = previousPage;
        } else {
          window.history.back();
        }
      }, 1000);
    } else if (data.response_type === 'close_browser') {
      console.log('💻 Close browser command');
      addMessage(`💻 ${data.message || 'Closing browser...'}`, 'system');
      speakMessage('Closing browser');
      setTimeout(() => {
        console.log('💻 Closing entire browser');
        window.open('', '_self').close();
      }, 1000);
    } else if (data.response_type === 'close_tab') {
      console.log('🔴 Close tab command');

      speakMessage('Closing current tab');

    } else if (data.response_type === 'open_tab' && data.path) {

        window.open(data.path, '_blank');
      }, 1000);
    } else if (data.response_type === 'navigation' && data.path) {
      console.log('🗺️ Single navigation command:', data.path);
      addMessage(`🗺️ ${data.message}`, 'system');
      const pageName = data.path.split('/').filter(p => p).join(' ') || 'home';
      speakMessage(`Navigating to ${pageName}`);
      setTimeout(() => {
        console.log('🚀 Navigating to:', data.path);
        window.location.href = data.path;
      }, 1500);
    } else if (data.response_type === 'button_click' && data.button_to_click) {
      console.log('🔘 Single button click:', data.button_to_click);
      addMessage(`🔘 ${data.message}`, 'system');

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  const floatBtn = document.getElementById('chatbot-float-btn');
  const panel = document.getElementById('chatbot-panel-unified');
  const closeBtn = document.getElementById('close-btn-unified');
  const sendBtn = document.getElementById('send-btn-unified');
  const input = document.getElementById('chatbot-input-unified');

  // Toggle panel
  floatBtn.addEventListener('click', async () => {
    panel.classList.toggle('active');
    floatBtn.classList.toggle('listening');
    
    // Load main menu when opening for the first time
    if (panel.classList.contains('active')) {
      const messagesDiv = document.getElementById('chatbot-messages-unified');
      const hasOnlyInitialMessage = messagesDiv.children.length <= 1;
      
      if (hasOnlyInitialMessage) {
        try {
          console.log('🎯 Loading main menu on chatbot open...');
          // Automatically request the main menu
          sendChatMessage('menu');
          // Clear initial message and load menu
          messagesDiv.innerHTML = '';
        } catch (error) {
          console.error('❌ Error loading menu:', error);
          addMessage('Error loading menu. Type "menu" to try again.', 'bot');
        }
      }
    }
  });

  closeBtn.addEventListener('click', () => {
    panel.classList.remove('active');
    // Stop listening if active
    if (isListening && recognition) {
      recognition.stop();
    }
  });

  // Send message
  sendBtn.addEventListener('click', () => {
    sendChatMessage(input.value.trim());
  });

  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      sendChatMessage(input.value.trim());
    }
  });

  // Language Selection Handlers
  const langEnBtn = document.getElementById('lang-en-btn');
  const langUrBtn = document.getElementById('lang-ur-btn');

  langEnBtn.addEventListener('click', () => {
    selectedLanguage = 'en';
    langEnBtn.classList.add('active');
    langUrBtn.classList.remove('active');
    console.log('🇬🇧 Language switched to English');
    addMessage('🇬🇧 Switched to English mode. I will only accept English voice commands.', 'bot');
    speakMessage('Switched to English mode');
  });

  langUrBtn.addEventListener('click', () => {
    selectedLanguage = 'ur';
    langUrBtn.classList.add('active');
    langEnBtn.classList.remove('active');
    console.log('🇵🇰 Language switched to Urdu');
    addMessage('🇵🇰 اردو موڈ میں تبدیل کر دیا گیا ہے۔ میں اردو اور انگریزی دونوں کو قبول کروں گا۔', 'bot');
    speakMessage('Switched to Urdu mode');
  });

  // Speech Recognition Setup
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;  // ON-DEMAND: Only listen for one phrase at a time
    recognition.interimResults = true;  // Show interim results
    recognition.language = 'en-US';

    recognition.onstart = () => {
      isListening = true;
      voiceBtn.classList.add('listening');
      addMessage('🎤 Listening... speak now!', 'system');
      console.log('🎤 Listening started');
    };

    recognition.onend = () => {
      console.log('🛑 Listening stopped');
      isListening = false;
      voiceBtn.classList.remove('listening');
    };

    recognition.onresult = async (event) => {
      let transcript = '';
      let isFinal = false;

      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          isFinal = true;
        }
      }

      transcript = transcript.trim();
      console.log('🎤 Transcript:', transcript, 'Final:', isFinal);

      // Update input field with interim results
      if (transcript) {
        input.value = transcript;
      }
      
      // Process only final results
      if (isFinal && transcript) {
        console.log('🎤 Final transcript:', transcript);
        console.log('🌍 Selected language mode:', selectedLanguage);
        
        let processedText = transcript;

        if (selectedLanguage === 'ur') {
          // Urdu mode: Auto-detect and translate if needed
          const lang = detectLanguage(transcript);
          console.log('🌐 Auto-detected language:', lang);
          
          if (lang === 'ur') {
            console.log('🇵🇰 Translating Urdu to English...');
            processedText = await translateUrduToEnglish(transcript);
            console.log('✅ Translated text:', processedText);
          }
        } else {
          // English mode: Only process English text
          const lang = detectLanguage(transcript);
          console.log('🌐 Detected language:', lang);
          
          if (lang === 'ur') {
            console.log('⚠️ Urdu text detected, but English mode selected. Ignoring.');
            addMessage('📢 I\'m set to English mode. Please speak in English or switch to Urdu mode.', 'bot');
            input.value = '';
            return;
          }
        }

        console.log('📝 Final processed text:', processedText);
        
        if (processedText && processedText.length > 2) {
          console.log('📤 Sending command:', processedText);
          
          input.value = processedText;
          // Small delay to ensure input is populated
          setTimeout(() => {
            sendChatMessage(processedText);
          }, 300);
        } else {
          console.log('⚠️ Command too short, ignoring');
          input.value = '';
        }
      }
    };

    recognition.onerror = (event) => {
      console.warn('🎤 Recognition error:', event.error);
      isListening = false;
      voiceBtn.classList.remove('listening');
      
      if (event.error === 'network') {
        addMessage('⚠️ Network error. Check your internet connection.', 'system');
      } else if (event.error === 'audio-capture') {
        addMessage('⚠️ No microphone detected. Please check your audio device.', 'system');
      } else {
        addMessage(`⚠️ Error: ${event.error}`, 'system');
      }
    };

    // Voice Button Click Handler - Start/Stop Listening
    voiceBtn.addEventListener('click', () => {
      if (!isListening) {
        // Start listening
        console.log('🎙️ Starting voice recording...');
        try {
          recognition.start();
        } catch (e) {
          console.warn('⚠️ Could not start recognition:', e.message);
        }
      } else {
        // Stop listening
        console.log('🛑 Stopping voice recording...');
        try {
          recognition.stop();
          isListening = false;
          voiceBtn.classList.remove('listening');
        } catch (e) {
          console.warn('⚠️ Could not stop recognition:', e.message);
        }
      }
    });

  } else {
    addMessage('⚠️ Voice recognition not supported in your browser.', 'bot');
  }
});
</script>
