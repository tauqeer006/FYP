<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #17d1f6, #b6d8c1);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(50px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .form-control, .btn {
            border-radius: 10px;
        }
        .role-select {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">
                    <h3 class="text-center mb-4">Admin Login</h3>
                  <form method="POST" action="{% url 'admin_login' %}">
    {% csrf_token %}
    <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" placeholder="Enter username" required name="username">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Password" required name="password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>

    <p class="text-center mt-3 mb-0">
        <a href="#">Forgot password?</a>
    </p>
</form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
