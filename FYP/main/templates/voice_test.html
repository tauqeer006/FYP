<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recognition Test - Debug Console</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border-left: 4px solid #344dbd;
            background: #f9f9f9;
        }
        button {
            background: #344dbd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-size: 14px;
        }
        button:hover {
            background: #764ba2;
        }
        button.danger {
            background: #f5576c;
        }
        .output {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .log-entry {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .log-entry.error {
            color: #d32f2f;
        }
        .log-entry.success {
            color: #388e3c;
        }
        .log-entry.info {
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Recognition & Chatbot Debug Console</h1>
        
        <div class="test-section">
            <h2>Browser Capabilities</h2>
            <button onclick="checkBrowserCapabilities()">Check Browser Support</button>
            <div id="browserOutput" class="output"></div>
        </div>

        <div class="test-section">
            <h2>Speech Recognition Test</h2>
            <button onclick="testSpeechRecognition()">Start Voice Test</button>
            <button onclick="stopSpeechRecognition()" class="danger">Stop</button>
            <div id="voiceOutput" class="output"></div>
        </div>

        <div class="test-section">
            <h2>Microphone Access</h2>
            <button onclick="requestMicrophoneAccess()">Request Microphone Permission</button>
            <div id="micOutput" class="output"></div>
        </div>

        <div class="test-section">
            <h2>Chatbot API Test</h2>
            <input type="text" id="testQuery" placeholder="Enter test query..." style="padding: 10px; width: 300px; border: 1px solid #ddd; border-radius: 4px;">
            <button onclick="testChatbotAPI()">Send to Chatbot API</button>
            <div id="chatbotOutput" class="output"></div>
        </div>

        <div class="test-section">
            <h2>Console Logs</h2>
            <button onclick="clearLogs()">Clear Logs</button>
            <div id="consoleLogs" class="output"></div>
        </div>
    </div>

    <script>
        let voiceRecognition = null;
        let consoleLogs = [];

        // Override console functions to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog('info', args.join(' '));
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addLog('error', args.join(' '));
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog('warning', args.join(' '));
        };

        function addLog(type, message) {
            consoleLogs.push({ type, message, time: new Date().toLocaleTimeString() });
            const logsDiv = document.getElementById('consoleLogs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function clearLogs() {
            consoleLogs = [];
            document.getElementById('consoleLogs').innerHTML = '';
        }

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            element.appendChild(div);
            element.scrollTop = element.scrollHeight;
        }

        function checkBrowserCapabilities() {
            const output = document.getElementById('browserOutput');
            output.innerHTML = '';

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const hasSpeechRecognition = !!SpeechRecognition;
            
            const hasMediaDevices = !!navigator.mediaDevices;
            const hasGetUserMedia = hasMediaDevices && !!navigator.mediaDevices.getUserMedia;

            let html = '<div class="status ' + (hasSpeechRecognition ? 'success' : 'error') + '">';
            html += hasSpeechRecognition ? '✅ Speech Recognition: Supported' : '❌ Speech Recognition: NOT Supported';
            html += '</div>';

            html += '<div class="status ' + (hasGetUserMedia ? 'success' : 'error') + '">';
            html += hasGetUserMedia ? '✅ Microphone Access: Supported' : '❌ Microphone Access: NOT Supported';
            html += '</div>';

            html += '<div class="status ' + (!!window.fetch ? 'success' : 'error') + '">';
            html += window.fetch ? '✅ Fetch API: Supported' : '❌ Fetch API: NOT Supported';
            html += '</div>';

            html += '<div class="status warning">';
            html += '📱 User Agent: ' + navigator.userAgent.substring(0, 100) + '...';
            html += '</div>';

            output.innerHTML = html;
            log('browserOutput', 'Browser capabilities checked', 'success');
        }

        function requestMicrophoneAccess() {
            const output = document.getElementById('micOutput');
            output.innerHTML = '';

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                log('micOutput', '❌ Microphone access not supported', 'error');
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    log('micOutput', '✅ Microphone access granted!', 'success');
                    stream.getTracks().forEach(track => track.stop());
                })
                .catch(error => {
                    log('micOutput', '❌ Microphone access denied: ' + error.message, 'error');
                });
        }

        function testSpeechRecognition() {
            const output = document.getElementById('voiceOutput');
            output.innerHTML = '';

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                log('voiceOutput', '❌ Speech Recognition not supported', 'error');
                return;
            }

            voiceRecognition = new SpeechRecognition();
            voiceRecognition.continuous = false;
            voiceRecognition.interimResults = true;
            voiceRecognition.language = 'en-US';

            log('voiceOutput', '🎤 Starting voice recognition...', 'info');
            log('voiceOutput', '📢 Please speak now...', 'warning');

            voiceRecognition.onstart = () => {
                log('voiceOutput', '✅ Listening started', 'success');
            };

            voiceRecognition.onresult = (event) => {
                let transcript = '';
                let isFinal = false;

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        isFinal = true;
                    }
                }

                const confidence = event.results[event.results.length - 1][0].confidence;
                log('voiceOutput', 
                    `${isFinal ? '✅ FINAL' : '⏳ INTERIM'}: "${transcript}" (Confidence: ${(confidence * 100).toFixed(0)}%)`, 
                    isFinal ? 'success' : 'info');
            };

            voiceRecognition.onerror = (event) => {
                log('voiceOutput', `❌ Error: ${event.error}`, 'error');
            };

            voiceRecognition.onend = () => {
                log('voiceOutput', '⏹️ Listening ended', 'warning');
            };

            try {
                voiceRecognition.start();
            } catch (e) {
                log('voiceOutput', `❌ Error starting: ${e.message}`, 'error');
            }
        }

        function stopSpeechRecognition() {
            if (voiceRecognition) {
                voiceRecognition.stop();
                log('voiceOutput', '⏹️ Stopped by user', 'warning');
            }
        }

        function testChatbotAPI() {
            const query = document.getElementById('testQuery').value.trim();
            const output = document.getElementById('chatbotOutput');
            output.innerHTML = '';

            if (!query) {
                log('chatbotOutput', '❌ Please enter a query', 'error');
                return;
            }

            log('chatbotOutput', `📤 Sending query: "${query}"`, 'info');

            fetch('/api/chatbot/query/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ query: query })
            })
            .then(response => {
                log('chatbotOutput', `📥 Response Status: ${response.status}`, 'info');
                return response.json();
            })
            .then(data => {
                log('chatbotOutput', '✅ API Response:', 'success');
                log('chatbotOutput', JSON.stringify(data, null, 2), 'success');
            })
            .catch(error => {
                log('chatbotOutput', `❌ Error: ${error.message}`, 'error');
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Run initial checks on page load
        window.addEventListener('load', () => {
            log('consoleLogs', '🚀 Debug console loaded', 'success');
            checkBrowserCapabilities();
        });
    </script>

    <!-- Chatbot Widget -->
    {% include 'components/chatbot_widget_unified.html' %}

    <!-- Global Voice Recorder -->
    {% include 'components/global_voice_recorder.html' %}
</body>
</html>
