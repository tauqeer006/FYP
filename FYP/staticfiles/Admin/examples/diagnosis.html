        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add Diagnosis Details</h5>
        </div>
        <div class="card-body">
            <form>
                <!-- Patient Selection -->
                <div class="form-group">
                    <label for="patientSelect">Select Patient</label>
                    <select class="form-control" id="patientSelect" required>
                        <option disabled selected value="">-- Select Patient --</option>
                        <option value="1">John Doe</option>
                        <option value="2">Jane Smith</option>
                        <option value="3">Ali Khan</option>
                    </select>
                </div>

                <!-- Patient Info -->
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Patient Name" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="age">Age</label>
                        <input type="number" class="form-control" id="age" placeholder="Age" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="gender">Gender</label>
                        <select class="form-control" id="gender" required>
                            <option disabled selected value="">-- Select Gender --</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <!-- Diagnosis Upload -->
                <div class="form-group">
                    <label for="xrayUpload">Upload X-ray Images</label>
                    <input type="file" class="form-control-file" id="xrayUpload" accept="image/*" multiple required>
                    <small class="form-text text-muted">Upload 1 to 5 X-ray images.</small>
                </div>

                <!-- Submit Button -->
<!-- Submit Button -->
<div class="d-flex justify-content-between">
