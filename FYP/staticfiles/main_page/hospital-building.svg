<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3d9e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="60" rx="40" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="130" cy="50" rx="50" ry="30" fill="white" opacity="0.7"/>
  <ellipse cx="700" cy="80" rx="45" ry="28" fill="white" opacity="0.6"/>
  <ellipse cx="735" cy="70" rx="55" ry="32" fill="white" opacity="0.6"/>
  
  <!-- Main Building -->
  <rect x="150" y="150" width="500" height="300" fill="url(#buildingGrad)" stroke="#666" stroke-width="3"/>
  
  <!-- Roof -->
  <polygon points="150,150 400,50 650,150" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Red Cross on Roof (Hospital Symbol) -->
  <rect x="380" y="75" width="40" height="8" fill="white"/>
  <rect x="390" y="65" width="8" height="28" fill="white"/>
  
  <!-- Main Door -->
  <rect x="375" y="380" width="50" height="70" fill="#8B4513" stroke="#5C3D1F" stroke-width="2"/>
  <circle cx="418" cy="415" r="3" fill="#FFD700"/>
  
  <!-- Door Frame -->
  <rect x="370" y="375" width="60" height="80" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Windows - Left side (5x4 grid) -->
  <g id="windows-left">
    <!-- Row 1 -->
    <rect x="170" y="170" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="210" y="170" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="250" y="170" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="170" y="220" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="210" y="220" width="30" height="30" fill="#FFD700" stroke="#333" stroke-width="1"/>
    <rect x="250" y="220" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <!-- Row 3 -->
    <rect x="170" y="270" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="210" y="270" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="250" y="270" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Windows - Right side (5x4 grid) -->
  <g id="windows-right">
    <!-- Row 1 -->
    <rect x="520" y="170" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="560" y="170" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="600" y="170" width="30" height="30" fill="#FFD700" stroke="#333" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="520" y="220" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="560" y="220" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="600" y="220" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <!-- Row 3 -->
    <rect x="520" y="270" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <rect x="560" y="270" width="30" height="30" fill="#FFD700" stroke="#333" stroke-width="1"/>
    <rect x="600" y="270" width="30" height="30" fill="#87CEEB" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Flag pole -->
  <rect x="395" y="30" width="3" height="25" fill="#333"/>
  
  <!-- Hospital Flag -->
  <circle cx="410" cy="40" r="12" fill="#e74c3c"/>
  <text x="410" y="45" font-size="16" fill="white" text-anchor="middle" font-weight="bold">+</text>
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="50" fill="#90EE90"/>
  
  <!-- Grass pattern -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#7CCD7C" stroke-width="1"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#7CCD7C" stroke-width="1"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#7CCD7C" stroke-width="1"/>
  
  <!-- Ambulance -->
  <rect x="50" y="420" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <circle cx="70" cy="450" r="8" fill="#333"/>
  <circle cx="100" cy="450" r="8" fill="#333"/>
  <rect x="65" y="422" width="8" height="8" fill="#FFD700"/>
  <text x="75" y="439" font-size="12" fill="white" text-anchor="middle" font-weight="bold">🚑</text>
</svg>
