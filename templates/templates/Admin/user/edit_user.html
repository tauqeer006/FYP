<div id="edit-user-container">
  <h3 class="text-xl font-semibold mb-4">Edit User</h3>
  <form id="edit-user-form" class="grid grid-cols-1 md:grid-cols-2 gap-6" data-id="">
    
    <!-- Name -->
    <div>
      <label for="edit-name" class="block mb-1">Name</label>
      <input id="edit-name" name="name" type="text"
        class="w-full border border-gray-300 rounded p-2" required />
    </div>

    <!-- Email -->
    <div>
      <label for="edit-email" class="block mb-1">Email</label>
      <input id="edit-email" name="email" type="email"
        class="w-full border border-gray-300 rounded p-2" required />
    </div>

    <!-- Gender -->
    <div>
      <label for="edit-gender" class="block mb-1">Gender</label>
      <select id="edit-gender" name="gender"
        class="w-full border border-gray-300 rounded p-2" required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Age -->
    <div>
      <label for="edit-age" class="block mb-1">Age</label>
      <input id="edit-age" name="age" type="number" min="1" step="1"
        class="w-full border border-gray-300 rounded p-2" required />
    </div>

    <!-- Weight -->
    <div>
      <label for="edit-weight" class="block mb-1">Weight (kg)</label>
      <input id="edit-weight" name="weight" type="number" min="1"
        class="w-full border border-gray-300 rounded p-2" required />
    </div>

    <!-- Password -->
    <div>
      <label for="edit-password" class="block mb-1">Password</label>
      <input id="edit-password" name="password" type="password"
        class="w-full border border-gray-300 rounded p-2" />
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="edit-confirm-password" class="block mb-1">Confirm Password</label>
      <input id="edit-confirm-password" name="confirm_password" type="password"
        class="w-full border border-gray-300 rounded p-2" />
    </div>

    <!-- Submit Button -->
    <div class="md:col-span-2 flex justify-end">
      <button type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
    </div>

  </form>
</div>
