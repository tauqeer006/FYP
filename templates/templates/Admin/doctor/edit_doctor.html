<div id="edit-doctor-container" class="p-4 border border-gray-300 rounded-lg bg-white max-w-3xl mx-auto mt-8">
  <h3 class="text-xl font-semibold mb-4">Edit Doctor</h3>
  <form id="edit-doctor-form" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full" data-id="">
    <!-- Full Name -->
    <div>
      <label for="edit-doctor-name" class="block mb-2 text-sm font-medium text-gray-900">Full Name</label>
      <input type="text" id="edit-doctor-name" name="name" placeholder="Dr. John Doe"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Email -->
    <div>
      <label for="edit-doctor-email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
      <input type="email" id="edit-doctor-email" name="email" placeholder="john@example.com"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Gender -->
    <div>
      <label for="edit-doctor-gender" class="block mb-2 text-sm font-medium text-gray-900">Gender</label>
      <select id="edit-doctor-gender" name="gender"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Age -->
    <div>
      <label for="edit-doctor-age" class="block mb-2 text-sm font-medium text-gray-900">Age</label>
      <input type="number" min="25" step="1" id="edit-doctor-age" name="age" placeholder="30"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Specialty -->
    <div>
      <label for="edit-doctor-specialty" class="block mb-2 text-sm font-medium text-gray-900">Specialty</label>
      <input type="text" id="edit-doctor-specialty" name="specialty" placeholder="Cardiology, Dermatology..."
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- License Number -->
    <div>
      <label for="edit-doctor-license" class="block mb-2 text-sm font-medium text-gray-900">License Number</label>
      <input type="text" id="edit-doctor-license" name="license_number" placeholder="ABC123456"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Years of Experience -->
    <div>
      <label for="edit-doctor-experience" class="block mb-2 text-sm font-medium text-gray-900">Years of Experience</label>
      <input type="number" min="0" step="1" id="edit-doctor-experience" name="experience" placeholder="5"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Phone Number -->
    <div>
      <label for="edit-doctor-phone" class="block mb-2 text-sm font-medium text-gray-900">Phone Number</label>
      <input type="tel" id="edit-doctor-phone" name="phone" placeholder="+123456789"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Address -->
    <div class="md:col-span-2">
      <label for="edit-doctor-address" class="block mb-2 text-sm font-medium text-gray-900">Address</label>
      <textarea id="edit-doctor-address" name="address" rows="3" placeholder="123 Clinic St, City, Country"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required></textarea>
    </div>

    <!-- Password -->
    <div>
      <label for="edit-doctor-password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
      <input type="password" id="edit-doctor-password" name="password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
      <small class="text-gray-500">Leave blank to keep current password</small>
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="edit-doctor-confirm-password" class="block mb-2 text-sm font-medium text-gray-900">Confirm Password</label>
      <input type="password" id="edit-doctor-confirm-password" name="confirm_password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
    </div>

    <!-- Submit Button -->
    <div class="md:col-span-2 flex justify-end">
      <button type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-2.5 text-center">
        Save Changes
      </button>
    </div>
  </form>
</div>
