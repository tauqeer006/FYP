<form class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full" id="doctor-register-form">
  <!-- Full Name -->
  <div>
    <label for="doctor-name" class="block mb-2 text-sm font-medium text-gray-900">Full Name</label>
    <input type="text" id="doctor-name" name="name" placeholder="Dr. John Doe"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Email -->
  <div>
    <label for="doctor-email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
    <input type="email" id="doctor-email" name="email" placeholder="john@example.com"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Gender -->
  <div>
    <label for="doctor-gender" class="block mb-2 text-sm font-medium text-gray-900">Gender</label>
    <select id="doctor-gender" name="gender"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required>
      <option value="">Select gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
  </div>

  <!-- Age -->
  <div>
    <label for="doctor-age" class="block mb-2 text-sm font-medium text-gray-900">Age</label>
    <input type="number" min="25" step="1" id="doctor-age" name="age" placeholder="30"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Specialty -->
  <div>
    <label for="doctor-specialty" class="block mb-2 text-sm font-medium text-gray-900">Specialty</label>
    <input type="text" id="doctor-specialty" name="specialty" placeholder="Cardiology, Dermatology..."
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- License Number -->
  <div>
    <label for="doctor-license" class="block mb-2 text-sm font-medium text-gray-900">License Number</label>
    <input type="text" id="doctor-license" name="license_number" placeholder="ABC123456"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Years of Experience -->
  <div>
    <label for="doctor-experience" class="block mb-2 text-sm font-medium text-gray-900">Years of Experience</label>
    <input type="number" min="0" step="1" id="doctor-experience" name="experience" placeholder="5"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Phone Number -->
  <div>
    <label for="doctor-phone" class="block mb-2 text-sm font-medium text-gray-900">Phone Number</label>
    <input type="tel" id="doctor-phone" name="phone" placeholder="+123456789"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Address -->
  <div class="md:col-span-2">
    <label for="doctor-address" class="block mb-2 text-sm font-medium text-gray-900">Address</label>
    <textarea id="doctor-address" name="address" rows="3" placeholder="123 Clinic St, City, Country"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required></textarea>
  </div>

  <!-- Password -->
  <div>
    <label for="doctor-password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
    <input type="password" id="doctor-password" name="password"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Confirm Password -->
  <div>
    <label for="doctor-confirm-password" class="block mb-2 text-sm font-medium text-gray-900">Confirm Password</label>
    <input type="password" id="doctor-confirm-password" name="confirm_password"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      required />
  </div>

  <!-- Submit Button -->
  <div class="md:col-span-2 flex justify-end">
    <button type="submit"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-2.5 text-center">
      Register Doctor
    </button>
  </div>
</form>
