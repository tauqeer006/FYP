{% block content %}
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #e6f0ff;
    margin: 0;
    padding: 0;
  }

  .content-section {
    background-color: #ffffff;
    padding: 40px;
    margin: 40px auto;
    border-radius: 12px;
    max-width: 800px;
    box-shadow: 0 4px 12px rgba(0, 93, 180, 0.2);
    border-top: 6px solid #005db4;
  }

  .content-section h2 {
    color: #005db4;
    margin-bottom: 30px;
    text-align: center;
  }

  .form-section .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
  }

  .form-col {
    flex: 1;
    min-width: 220px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 6px;
    font-weight: 600;
    color: #003d80;
  }

  .form-control {
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #b3d1ff;
    border-radius: 6px;
    background-color: #f4faff;
    transition: border-color 0.3s;
  }

  .form-control:focus {
    border-color: #3399ff;
    outline: none;
  }

  .submit-btn {
    background-color: #005db4;
    color: #ffffff;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: block;
    margin: 30px auto 0;
    transition: background-color 0.3s;
  }

  .submit-btn:hover {
    background-color: #004a91;
  }

  textarea.form-control {
    resize: vertical;
    min-height: 80px;
  }
</style>

<div class="content-section form-section">
  <h2>Add New Patient</h2>
  <form method="POST" action="{% url 'add_patient_record1' %}">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" class="form-control" id="firstName" placeholder="Enter first name" name="fname" required>
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" class="form-control" id="lastName" placeholder="Enter last name" name="lname" required>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" class="form-control" id="dateOfBirth" name="dob" required>
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label for="gender">Gender</label>
          <select class="form-control" id="gender" name="gender" required>
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label for="parentName">Parent/Guardian Name</label>
          <input type="text" class="form-control" id="parentName" placeholder="Enter parent/guardian name" name="parents" required>
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label for="contactNumber">Contact Number</label>
          <input type="tel" class="form-control" id="contactNumber" placeholder="Enter contact number" name="contact_number" required>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" class="form-control" id="address" placeholder="Enter address" name="address">
    </div>

    <div class="form-group">
      <label for="medicalHistory">Medical History</label>
      <textarea class="form-control" id="medicalHistory" placeholder="Any relevant medical history, allergies, or conditions..." name="medical_history"></textarea>
    </div>

    <button type="submit" class="submit-btn">Add Patient</button>
  </form>
</div>
{% endblock %}
