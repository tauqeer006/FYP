  <form class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
    <!-- Name -->
    <div>
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Full Name</label>
      <input type="text" id="name" placeholder="John Doe"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
      <input type="email" id="email" placeholder="john@example.com"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Gender -->
    <div>
      <label for="gender" class="block mb-2 text-sm font-medium text-gray-900">Gender</label>
      <select id="gender"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Age -->
    <div>
      <label for="age" class="block mb-2 text-sm font-medium text-gray-900">Age</label>
      <input type="number" min="1" step="1" id="age" placeholder="25"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Weight -->
    <div>
      <label for="weight" class="block mb-2 text-sm font-medium text-gray-900">Weight (kg)</label>
      <input type="number" id="weight" placeholder="70"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Phone -->
    <div>
      <label for="phone" class="block mb-2 text-sm font-medium text-gray-900">Phone Number</label>
      <input type="tel" id="phone" placeholder="+123456789"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Address -->
    <div class="md:col-span-2">
      <label for="address" class="block mb-2 text-sm font-medium text-gray-900">Address</label>
      <textarea id="address" rows="3" placeholder="123 Street, City, Country"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required></textarea>
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
      <input type="password" id="password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900">Confirm Password</label>
      <input type="password" id="confirm-password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        required />
    </div>

    <!-- Submit Button -->
    <div class="md:col-span-2 flex justify-end">
      <button type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-2.5 text-center">
        Register
      </button>
    </div>
  </form>
