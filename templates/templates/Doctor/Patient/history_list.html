<div class="p-4">
  <h2 class="text-2xl font-semibold mb-4">User List</h2>

  <!-- Filters & Sorting -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-4">
    
    <!-- Search Filters -->
    <div class="flex flex-col sm:flex-row flex-wrap gap-2 w-full sm:w-auto">
      <input type="text" id="search-name" name="search_name" placeholder="Search by Name"
        class="border border-gray-300 rounded px-3 py-1 text-sm w-full sm:w-48" />
      <input type="text" id="search-id" name="search_id" placeholder="Search by ID"
        class="border border-gray-300 rounded px-3 py-1 text-sm w-full sm:w-40" />
      <select id="search-gender" name="search_gender"
        class="border border-gray-300 rounded px-3 py-1 text-sm w-full sm:w-40">
        <option value="">All Genders</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Sort Dropdown -->
    <div class="w-full sm:w-auto">
      <select id="sort-by" name="sort_by" class="border border-gray-300 rounded px-3 py-1 text-sm w-full sm:w-40">
        <option value="">Sort By</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="id-asc">ID Asc</option>
        <option value="id-desc">ID Desc</option>
      </select>
    </div>
  </div>

  <!-- Responsive Table Wrapper -->
  <div class="overflow-x-auto">
    <table class="table-auto w-full border-collapse border border-gray-300 mb-6 min-w-[600px]">
      <thead>
        <tr>
          <th class="border border-gray-300 px-4 py-2">ID</th>
          <th class="border border-gray-300 px-4 py-2">Name</th>
          <th class="border border-gray-300 px-4 py-2">Email</th>
          <th class="border border-gray-300 px-4 py-2">Gender</th>
          <th class="border border-gray-300 px-4 py-2">Age</th>
          <th class="border border-gray-300 px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="user-table-body">
        <tr>
          <td class="border px-4 py-2">1</td>
          <td class="border px-4 py-2">Alice Smith</td>
          <td class="border px-4 py-2">alice@example.com</td>
          <td class="border px-4 py-2">Female</td>
          <td class="border px-4 py-2">28</td>
          <td class="border px-4 py-2">
            <button class="bg-yellow-400 px-2 py-1 rounded mr-2">Edit</button>
            <button class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">2</td>
          <td class="border px-4 py-2">Bob Johnson</td>
          <td class="border px-4 py-2">bob@example.com</td>
          <td class="border px-4 py-2">Male</td>
          <td class="border px-4 py-2">35</td>
          <td class="border px-4 py-2">
            <button class="bg-yellow-400 px-2 py-1 rounded mr-2">Edit</button>
            <button class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">3</td>
          <td class="border px-4 py-2">Charlie Lee</td>
          <td class="border px-4 py-2">charlie@example.com</td>
          <td class="border px-4 py-2">Other</td>
          <td class="border px-4 py-2">22</td>
          <td class="border px-4 py-2">
            <button class="bg-yellow-400 px-2 py-1 rounded mr-2">Edit</button>
            <button class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit User Modal -->
<div id="edit-user-modal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-md relative">
    <button id="close-edit-modal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">&times;</button>
    <h3 class="text-xl font-semibold mb-4">Edit User</h3>
    <form id="edit-user-form" name="edit_user_form" class="space-y-4" data-id="">
      <div>
        <label for="edit-name" class="block mb-1">Name</label>
        <input id="edit-name" name="name" type="text" class="w-full border border-gray-300 rounded p-2" required />
      </div>
      <div>
        <label for="edit-email" class="block mb-1">Email</label>
        <input id="edit-email" name="email" type="email" class="w-full border border-gray-300 rounded p-2" required />
      </div>
      <div>
        <label for="edit-gender" class="block mb-1">Gender</label>
        <select id="edit-gender" name="gender" class="w-full border border-gray-300 rounded p-2" required>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="edit-age" class="block mb-1">Age</label>
        <input id="edit-age" name="age" type="number" min="1" step="1" class="w-full border border-gray-300 rounded p-2" required />
      </div>
      <button type="submit" id="edit-submit-btn"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Save
      </button>
    </form>
  </div>
</div>
