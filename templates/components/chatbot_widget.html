<!-- Chatbot Widget - Non-Intrusive Floating Component -->
<style>
  /* Chatbot Widget Styles - Isolated to prevent design conflicts */
  .chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9998;
    font-family: 'Poppins', sans-serif;
  }

  .chatbot-button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .chatbot-button:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
  }

  .chatbot-button.active {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  }

  .chatbot-panel {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 380px;
    max-width: 90vw;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .chatbot-panel.active {
    display: flex;
  }

  .chatbot-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chatbot-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .chatbot-close {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chatbot-close:hover {
    transform: rotate(90deg);
    transition: transform 0.3s ease;
  }

  .chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chatbot-messages::-webkit-scrollbar {
    width: 6px;
  }

  .chatbot-messages::-webkit-scrollbar-track {
    background: #f1f1f1;
  }

  .chatbot-messages::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 3px;
  }

  .message {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    animation: slideIn 0.3s ease;
    max-width: 85%;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message.bot {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    align-self: flex-start;
    word-wrap: break-word;
  }

  .message.user {
    background: #e8eaf6;
    color: #333;
    align-self: flex-end;
    word-wrap: break-word;
  }

  .chatbot-input-area {
    padding: 15px;
    border-top: 1px solid #ddd;
    background: white;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .voice-button {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: #667eea;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s;
    padding: 0;
  }

  .voice-button:hover {
    background: #764ba2;
  }

  .voice-button.listening {
    background: #f5576c;
    animation: pulse 0.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .chatbot-text-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: border-color 0.3s;
  }

  .chatbot-text-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
  }

  .send-button {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: #667eea;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s;
    padding: 0;
  }

  .send-button:hover {
    background: #764ba2;
  }

  .send-button:active {
    transform: scale(0.95);
  }

  /* Mobile Responsive */
  @media (max-width: 480px) {
    .chatbot-widget {
      bottom: 10px;
      right: 10px;
    }

    .chatbot-button {
      width: 55px;
      height: 55px;
      font-size: 20px;
    }

    .chatbot-panel {
      width: calc(100vw - 20px);
      height: 60vh;
      bottom: 70px;
    }

    .message {
      max-width: 90%;
      font-size: 13px;
    }
  }
</style>

<div class="chatbot-widget">
  <!-- Floating Button -->
  <button class="chatbot-button" id="chatbot-toggle" title="Open Chatbot">
    <i class="fas fa-comments"></i>
  </button>

  <!-- Chat Panel -->
  <div class="chatbot-panel" id="chatbot-panel">
    <div class="chatbot-header">
      <h3>X-Ai Assistant</h3>
      <button class="chatbot-close" id="chatbot-close" title="Close">×</button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
      <div class="message bot">
        👋 Hello! I'm your X-Ai assistant. Try saying "diagnosis" or "patient reports" to navigate.
      </div>
    </div>

    <div class="chatbot-input-area">
      <button class="voice-button" id="voice-button" title="Click to speak">
        <i class="fas fa-microphone"></i>
      </button>
      <input 
        type="text" 
        class="chatbot-text-input" 
        id="chatbot-input" 
        placeholder="Type or say a command..."
        autocomplete="off"
      >
      <button class="send-button" id="send-button" title="Send">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('chatbot-toggle');
  const panel = document.getElementById('chatbot-panel');
  const closeBtn = document.getElementById('chatbot-close');
  const voiceBtn = document.getElementById('voice-button');
  const sendBtn = document.getElementById('send-button');
  const input = document.getElementById('chatbot-input');
  const messagesDiv = document.getElementById('chatbot-messages');

  let isListening = false;
  let recognition = null;

  // Check for Web Speech API support
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.language = 'en-US';

    recognition.onstart = function() {
      isListening = true;
      voiceBtn.classList.add('listening');
    };

    recognition.onend = function() {
      isListening = false;
      voiceBtn.classList.remove('listening');
    };

    recognition.onresult = function(event) {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      if (transcript.trim()) {
        input.value = transcript.trim();
        sendMessage();
      }
    };

    recognition.onerror = function(event) {
      console.error('Speech recognition error:', event.error);
      voiceBtn.classList.remove('listening');
    };
  }

  // Toggle panel
  toggle.addEventListener('click', () => {
    panel.classList.toggle('active');
    toggle.classList.toggle('active');
    if (panel.classList.contains('active')) {
      input.focus();
    }
  });

  // Close panel
  closeBtn.addEventListener('click', () => {
    panel.classList.remove('active');
    toggle.classList.remove('active');
    if (isListening) {
      recognition.stop();
    }
  });

  // Voice button
  voiceBtn.addEventListener('click', () => {
    if (!recognition) {
      alert('Voice recognition not supported in your browser');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });

  // Send message function
  const sendMessage = async () => {
    const text = input.value.trim();
    if (!text) return;

    // Add user message to UI
    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    messagesDiv.appendChild(userMsg);
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Send to backend
    try {
      const response = await fetch('/api/chatbot/query/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ query: text })
      });

      const data = await response.json();

      // Add bot response
      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      
      if (data.success && data.matched_route) {
        botMsg.textContent = '✅ Navigating to: ' + data.matched_route.description;
        messagesDiv.appendChild(botMsg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Navigate after a short delay
        setTimeout(() => {
          window.location.href = data.matched_route.path;
        }, 800);
      } else {
        botMsg.textContent = data.message || '❓ Sorry, I didn\'t understand that. Try "diagnosis", "patients", or "reports"';
        messagesDiv.appendChild(botMsg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    } catch (error) {
      console.error('Error:', error);
      const errorMsg = document.createElement('div');
      errorMsg.className = 'message bot';
      errorMsg.textContent = '⚠️ Error connecting to chatbot';
      messagesDiv.appendChild(errorMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  };

  // Send button click
  sendBtn.addEventListener('click', sendMessage);

  // Enter key in input
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Close on Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panel.classList.contains('active')) {
      panel.classList.remove('active');
      toggle.classList.remove('active');
    }
  });

  // Get CSRF token
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
});
</script>
