version: '3.8'

services:
  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyp_user -d fyp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Django Web Application - Main Interface
  django-app:
    build:
      context: .
      dockerfile: Dockerfile.django
    entrypoint: sh -c 'python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8888'
    ports:
      - "8888:8888"
    volumes:
      - ./FYP:/app
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=FYP.settings
    depends_on:
      postgres-db:
        condition: service_healthy
      cnn-api:
        condition: service_started
      xray-api:
        condition: service_started
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CNN API - Left/Right Fracture Detection
  cnn-api:
    build:
      context: .
      dockerfile: Dockerfile.cnn-api
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # X-ray Model API - Fracture Detection
  xray-api:
    build:
      context: .
      dockerfile: Dockerfile.xray-api
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  pose-api:
    build:
      context: .
      dockerfile: Dockerfile.pose-api
    ports:
      - "5003:5003"
    volumes:
      - ./pose_cv:/app
    env_file:
      - .env
    environment:
      - API_ENV=production
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Certbot - SSL Certificate Management
  certbot:
    image: certbot/certbot
    container_name: fyp-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: /bin/sh -c "certbot renew --quiet"
    depends_on:
      - nginx
    networks:
      - fyp-network
    restart: always

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: fyp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/app/media:ro
      - ./FYP/staticfiles:/app/staticfiles:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - django-app
      - cnn-api
      - xray-api
      - pose-api
    networks:
      - fyp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

networks:
  fyp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media-volume:
  certbot-conf:
  certbot-www:



